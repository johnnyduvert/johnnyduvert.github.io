version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    # Security updates skip the cooldown and are opened immediately.
    cooldown:
      semver-patch-days: 5
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
