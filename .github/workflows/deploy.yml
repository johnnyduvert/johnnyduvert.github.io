name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - name: Build static assets
        env:
          VITE_CMS_URL: ${{ vars.VITE_CMS_URL }}
        run: |
          test -n "$VITE_CMS_URL"
          case "$VITE_CMS_URL" in
            https://*) ;;
            *) echo "VITE_CMS_URL must be a public HTTPS URL" >&2; exit 1 ;;
          esac
          bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
