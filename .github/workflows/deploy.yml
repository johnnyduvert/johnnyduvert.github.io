name: Deploy static site to GitHub Pages

# GitHub Pages is configured (by the repo owner) to serve the root of the
# `master` branch. Source lives on `main`; this workflow builds it and
# commits the built site to `master` (no force push).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Build static assets
        env:
          VITE_CMS_URL: ${{ vars.VITE_CMS_URL }}
        run: |
          test -n "$VITE_CMS_URL"
          case "$VITE_CMS_URL" in
            https://*) ;;
            *) echo "VITE_CMS_URL must be a public HTTPS URL" >&2; exit 1 ;;
          esac
          bun run build
      - name: Publish dist/ to master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          # Serve files as-is (no Jekyll processing).
          touch dist/.nojekyll
          # Dependabot reads its config from the default branch (master).
          mkdir -p dist/.github
          cp .github/dependabot.yml dist/.github/dependabot.yml
          # Replace master's contents with the build as a normal commit
          # (no force push; master's history is preserved).
          git clone -q --depth 1 --branch master \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish
          cd publish
          git rm -rq --ignore-unmatch .
          cp -a ../dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish"; exit 0; fi
          git commit -q -m "Publish ${GITHUB_SHA::7} from main"
          git push -q origin master
